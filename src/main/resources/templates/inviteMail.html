<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join iManager</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f5f5f5;">
<!-- Main Table -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
  <tr>
    <td align="center" style="padding: 40px 0;">
      <!-- Content Table -->
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        <!-- Header -->
        <tr>
          <td align="center" style="padding: 40px 40px 20px 40px;">
            <h1 style="margin: 0; color: #1a1a1a; font-size: 24px; font-weight: 600;">
              Welcome to <span style="color: #2563eb;">iManager</span>
            </h1>
          </td>
        </tr>

        <!-- Content -->
        <tr>
          <td style="padding: 0 40px;">
            <p style="color: #4a5568; font-size: 16px; line-height: 24px; margin: 0 0 24px 0; text-align: center;">
              You've been invited to join <strong th:text="|${orgName}'s|"></strong>

              workspace on iManager.
            </p>
            <p style="color: #718096; font-size: 14px; line-height: 20px; margin: 0 0 32px 0; text-align: center;">
              Click the button below to accept the invitation and get started.
            </p>
          </td>
        </tr>

        <!-- Buttons -->
        <tr>
          <td align="center" style="padding: 0 40px 20px 40px;">
            <!-- Accept Button -->
            <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 16px;">
              <tr>
                <td align="center" style="border-radius: 6px; background-color: #2563eb;">
                  <a th:href="'https://imanager.vercel.app/invite.html?email=' + ${userEmail}"
                     style="display: inline-block; padding: 14px 32px; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none;">
                    Accept Invitation
                  </a>
                </td>
              </tr>
            </table>
            <!-- Decline Button -->
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center">
                  <a href="#" style="color: #64748b; text-decoration: underline; font-size: 14px;">
                    Decline Invitation
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!-- Footer Text -->
      <table width="600" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="padding: 24px 40px;">
            <p style="margin: 0; color: #94a3b8; font-size: 12px; line-height: 18px; text-align: center;">
              © 2025 iManager. All rights reserved.
            </p>
          </td>
        </tr>
      </table>
</table>
</body>
</html>
